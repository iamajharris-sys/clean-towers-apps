<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>bid blitz — swipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{ --sky:#29ABE2; --navy:#1A2B4A; --ink:#2D2D2D; --bg:#0d1420; --card:#141d2e; --line:rgba(255,255,255,.09); --good:#1e9e54; }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; background:var(--bg); color:#fff; font-family:'Inter',sans-serif; overscroll-behavior:none; }

  /* top bar */
  #topbar{ position:fixed; top:0; left:0; right:0; z-index:50; display:flex; align-items:center; justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px; pointer-events:none;
    background:linear-gradient(180deg, rgba(6,10,18,.85), rgba(6,10,18,0)); }
  #topbar .brand{ font-weight:900; font-size:14px; letter-spacing:.5px; text-shadow:0 1px 8px rgba(0,0,0,.6); }
  #topbar .brand span{ color:var(--sky); }
  #streak{ pointer-events:auto; background:rgba(20,29,46,.85); border:1px solid var(--line); border-radius:999px;
    padding:6px 12px; font-size:12px; font-weight:700; backdrop-filter:blur(8px); }
  #gearBtn,#searchBtn{ pointer-events:auto; background:rgba(20,29,46,.85); border:1px solid var(--line); border-radius:999px;
    width:32px; height:32px; color:#fff; font-size:15px; margin-left:8px; }
  #searchBtn{ margin:0 8px 0 0; font-size:13px; }

  /* search overlay */
  #searchOv{ position:fixed; inset:0; z-index:150; background:rgba(6,10,18,.96); backdrop-filter:blur(10px);
    display:none; flex-direction:column; padding:calc(env(safe-area-inset-top) + 14px) 14px 14px; }
  #searchOv.show{ display:flex; }
  .srow{ display:flex; gap:9px; margin-bottom:12px; }
  #searchIn{ flex:1; background:var(--card); border:1px solid var(--sky); border-radius:14px; color:#fff;
    font-family:inherit; font-size:15px; font-weight:600; padding:13px 15px; outline:none; }
  #searchX{ flex:none; width:48px; border-radius:14px; border:1px solid var(--line); background:var(--card);
    color:#fff; font-size:15px; font-weight:800; }
  #searchRes{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:7px; padding-bottom:20px; }
  .sres{ flex:none; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:13px;
    padding:12px 14px; color:#fff; font-family:inherit; }
  .sres:active{ border-color:var(--sky); }
  .sres .n{ font-size:14px; font-weight:800; }
  .sres .m{ font-size:11px; color:#8fa0b5; margin-top:2px; }
  .sres .st{ display:inline-block; font-size:9.5px; font-weight:800; color:var(--sky); border:1px solid rgba(41,171,226,.4);
    border-radius:99px; padding:1px 7px; margin-left:6px; vertical-align:1px; }

  /* feed */
  #feed{ height:100dvh; overflow-y:scroll; scroll-snap-type:y mandatory; scrollbar-width:none; }
  #feed::-webkit-scrollbar{ display:none; }
  .slide{ position:relative; height:100dvh; scroll-snap-align:start; scroll-snap-stop:always; overflow:hidden; background:var(--navy); }
  .mapbox{ position:absolute; inset:0; transform:scale(1.06); transition:transform 6s ease-out; }
  .slide.active .mapbox{ transform:scale(1.16); }
  .mapfallback{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:72px;
    background:radial-gradient(circle at 30% 20%, #23406e, var(--navy)); }
  .shade{ position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(180deg, rgba(6,10,18,.55) 0%, rgba(6,10,18,0) 22%, rgba(6,10,18,0) 42%, rgba(6,10,18,.92) 78%, #060a12 100%); }

  /* slide content */
  .content{ position:absolute; left:0; right:0; bottom:0; padding:0 14px calc(env(safe-area-inset-bottom) + 14px); z-index:5; }
  .namerow{ display:flex; align-items:flex-end; gap:10px; opacity:0; transform:translateY(24px) scale(.96); }
  .slide.active .namerow{ animation:pop .55s cubic-bezier(.2,1.4,.4,1) .1s forwards; }
  .bname{ font-size:30px; font-weight:900; line-height:1.05; letter-spacing:-.5px; text-shadow:0 2px 14px rgba(0,0,0,.7); flex:1; min-width:0; }
  .mkq{ flex:none; margin-bottom:4px; background:rgba(20,29,46,.85); border:1px solid rgba(41,171,226,.55); color:var(--sky);
    border-radius:999px; padding:7px 12px; font-family:inherit; font-size:11px; font-weight:800; backdrop-filter:blur(6px); white-space:nowrap; }
  .mkq:active{ background:var(--sky); color:#fff; }
  @keyframes pop{ to{ opacity:1; transform:none; } }
  .meta{ display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 12px; opacity:0; }
  .slide.active .meta{ animation:pop .5s ease .25s forwards; }
  .tag{ font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px; background:rgba(20,29,46,.85);
    border:1px solid var(--line); backdrop-filter:blur(6px); }
  .tag.sky{ color:var(--sky); border-color:rgba(41,171,226,.5); }
  .tag.warn{ color:#ffb64d; border-color:rgba(255,182,77,.4); }

  /* services */
  .svcwrap{ display:flex; flex-direction:column; gap:7px; max-height:38dvh; overflow-y:auto; scrollbar-width:none; }
  .svcwrap::-webkit-scrollbar{ display:none; }
  .svc{ flex:none; border:1px solid var(--line); background:rgba(20,29,46,.82); backdrop-filter:blur(10px); border-radius:14px; overflow:hidden;
    transition:border-color .2s, box-shadow .2s; }
  .svc.on{ border-color:var(--sky); box-shadow:0 0 0 1px var(--sky), 0 6px 24px rgba(41,171,226,.25); }
  .svc-head{ display:flex; align-items:center; gap:10px; padding:11px 12px; }
  .svc-check{ width:22px; height:22px; border-radius:8px; border:2px solid rgba(255,255,255,.3); flex:none;
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900; transition:.15s; }
  .svc.on .svc-check{ background:var(--sky); border-color:var(--sky); }
  .svc-title{ font-size:13.5px; font-weight:800; flex:1; }
  .pin-wrap{ display:none; text-align:right; }
  .svc.on .pin-wrap{ display:block; }
  .pin-wrap input{ width:86px; background:rgba(41,171,226,.16); border:1px solid rgba(41,171,226,.45); border-radius:9px;
    color:var(--sky); font-family:inherit; font-size:15px; font-weight:900; text-align:center; padding:6px 4px; outline:none; }
  .pin-wrap input:focus{ border-color:var(--sky); background:rgba(41,171,226,.26); }
  .pin-sub{ font-size:8px; color:#8fa0b5; font-weight:800; letter-spacing:.5px; margin-top:2px; }
  .svc-body{ display:none; padding:0 12px 12px; }
  .svc.on .svc-body{ display:block; animation:pop .3s ease; }
  .freqrow{ display:flex; gap:5px; margin-bottom:9px; }
  .freq{ flex:1; padding:7px 0; border-radius:9px; border:1px solid var(--line); background:transparent; color:#aab6c8;
    font-size:10.5px; font-weight:800; font-family:inherit; }
  .freq.on{ background:var(--sky); border-color:var(--sky); color:#fff; }
  .pricerow{ display:flex; align-items:center; gap:8px; }
  .step{ width:44px; height:38px; border-radius:10px; border:1px solid var(--line); background:rgba(255,255,255,.05);
    color:#fff; font-size:15px; font-weight:900; font-family:inherit; }
  .step:active{ background:var(--sky); }
  .pval{ flex:1; text-align:center; }
  .pval input{ width:100%; background:transparent; border:none; color:#fff; font-family:inherit; font-size:19px; font-weight:900;
    text-align:center; outline:none; }
  .pval .sub{ font-size:9.5px; color:#8fa0b5; font-weight:700; letter-spacing:.4px; }

  .addsvc{ flex:none; border:1px dashed rgba(41,171,226,.55); background:rgba(41,171,226,.07); color:var(--sky);
    border-radius:14px; padding:11px; font-family:inherit; font-size:12.5px; font-weight:800; }
  .addsvc:active{ background:rgba(41,171,226,.18); }
  .cname{ flex:1; background:transparent; border:none; border-bottom:1.5px solid rgba(255,255,255,.25); color:#fff;
    font-family:inherit; font-size:13.5px; font-weight:800; padding:2px 0; outline:none; min-width:0; }
  .cname:focus{ border-color:var(--sky); }
  .cdesc{ width:100%; background:transparent; border:none; border-bottom:1px dashed rgba(255,255,255,.18); color:#aab6c8;
    font-family:inherit; font-size:11px; padding:2px 0 4px; outline:none; margin-bottom:9px; }
  .cdesc:focus{ border-color:var(--sky); }
  .cx{ flex:none; width:24px; height:24px; border-radius:8px; border:none; background:rgba(255,255,255,.08); color:#8fa0b5;
    font-size:12px; font-weight:900; margin-right:6px; }

  /* build bar */
  .buildbar{ display:flex; align-items:center; gap:10px; margin-top:12px; }
  .tally{ background:rgba(20,29,46,.9); border:1px solid var(--line); border-radius:14px; padding:8px 14px; backdrop-filter:blur(8px); }
  .tally .tt{ font-size:9px; color:#8fa0b5; font-weight:800; letter-spacing:.6px; }
  .tally .tv{ font-size:19px; font-weight:900; color:var(--sky); }
  .gobtn{ flex:1; height:52px; border:none; border-radius:16px; background:linear-gradient(135deg,var(--sky),#1580c9);
    color:#fff; font-family:inherit; font-size:16px; font-weight:900; letter-spacing:.3px;
    box-shadow:0 8px 28px rgba(41,171,226,.4); transition:transform .12s; }
  .gobtn:disabled{ opacity:.35; box-shadow:none; }
  .gobtn:active{ transform:scale(.96); }

  .hint{ position:absolute; bottom:calc(env(safe-area-inset-bottom) + 6px); left:0; right:0; text-align:center; font-size:10px;
    color:#8fa0b5; font-weight:700; letter-spacing:.5px; z-index:6; animation:bob 2s ease infinite; pointer-events:none; }
  @keyframes bob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-5px);} }

  /* sheets */
  .sheet-bg{ position:fixed; inset:0; background:rgba(4,8,14,.7); backdrop-filter:blur(4px); z-index:90; display:none; }
  .sheet-bg.show{ display:block; }
  .sheet{ position:fixed; left:0; right:0; bottom:0; z-index:95; background:var(--card); border-radius:22px 22px 0 0;
    border-top:1px solid var(--line); padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);
    transform:translateY(105%); transition:transform .3s cubic-bezier(.2,1,.3,1); max-height:86dvh; overflow-y:auto; }
  .sheet.show{ transform:none; }
  .sheet h2{ font-size:17px; font-weight:900; margin-bottom:3px; }
  .sheet .sub2{ font-size:12px; color:#8fa0b5; margin-bottom:14px; }
  .qsum{ background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:14px; }
  .qrow{ display:flex; justify-content:space-between; font-size:12.5px; padding:5px 0; border-bottom:1px dashed var(--line); }
  .qrow:last-child{ border:none; }
  .qrow b{ font-weight:800; }
  .qrow .amt{ color:var(--sky); font-weight:800; }
  .qtotal{ display:flex; justify-content:space-between; align-items:center; margin-top:8px; padding-top:10px; border-top:1px solid var(--line); }
  .qtotal .lab{ font-size:11px; font-weight:800; letter-spacing:.5px; color:#8fa0b5; }
  .qtotal .val{ font-size:24px; font-weight:900; color:var(--sky); }
  .bigbtn{ width:100%; height:54px; border:none; border-radius:16px; font-family:inherit; font-size:15.5px; font-weight:900;
    margin-bottom:9px; color:#fff; }
  .bigbtn.send{ background:linear-gradient(135deg,var(--sky),#1580c9); box-shadow:0 8px 24px rgba(41,171,226,.35); }
  .bigbtn.ghost{ background:rgba(255,255,255,.06); border:1px solid var(--line); }
  .bigbtn.done{ background:var(--good); }
  .bigbtn:active{ transform:scale(.97); }
  .note{ font-size:10.5px; color:#8fa0b5; text-align:center; margin-top:2px; line-height:1.5; }

  /* settings sheet */
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:10.5px; font-weight:800; color:#8fa0b5; letter-spacing:.5px; margin-bottom:5px; text-transform:uppercase; }
  .field input,.field textarea{ width:100%; background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:11px;
    color:#fff; font-family:inherit; font-size:13.5px; padding:11px; outline:none; }
  .field textarea{ min-height:130px; resize:vertical; line-height:1.5; }
  .field input:focus,.field textarea:focus{ border-color:var(--sky); }

  /* toast + confetti */
  #toast{ position:fixed; top:calc(env(safe-area-inset-top) + 56px); left:50%; transform:translateX(-50%) translateY(-16px); z-index:120;
    background:var(--card); border:1px solid var(--sky); border-radius:12px; padding:10px 16px; font-size:12.5px; font-weight:700;
    opacity:0; transition:.25s; pointer-events:none; max-width:88vw; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.5); }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .gor{ position:fixed; z-index:110; font-size:30px; pointer-events:none; animation:fly 1.2s ease-out forwards; }
  @keyframes fly{ 0%{ transform:translateY(0) scale(.6) rotate(0); opacity:1; } 100%{ transform:translateY(-52vh) scale(1.5) rotate(24deg); opacity:0; } }

  #loader{ position:fixed; inset:0; z-index:200; background:var(--bg); display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; }
  #loader .g{ font-size:52px; animation:bob 1.2s ease infinite; }
  #loader p{ font-size:12px; color:#8fa0b5; font-weight:700; letter-spacing:.5px; }
  .empty{ height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:30px; }
  .empty .g{ font-size:56px; }
  .empty p{ color:#8fa0b5; font-size:13px; line-height:1.6; }
</style>
</head>
<body>

<div id="loader"><div class="g">🦍</div><p>loading buildings…</p></div>

<div id="topbar">
  <div class="brand">BID <span>BLITZ</span> swipe</div>
  <div style="display:flex;align-items:center">
    <button id="searchBtn">🔍</button>
    <div id="streak">🦍 0 sent today</div>
    <button id="gearBtn">⚙</button>
  </div>
</div>

<div id="feed"></div>
<div class="hint" id="hint">swipe up for next building ↑</div>

<!-- quote sheet -->
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="qSheet">
  <h2 id="qsName">quote</h2>
  <div class="sub2" id="qsMeta"></div>
  <div class="qsum" id="qsRows"></div>
  <button class="bigbtn send" id="btnSend">send it 🦍</button>
  <button class="bigbtn ghost" id="btnDl">download pdf</button>
  <button class="bigbtn done" id="btnMark" style="display:none">✓ mark sent — flip to quoted</button>
  <div class="note" id="qsNote">send opens your share sheet with the pdf attached — pick mail.<br>manager email gets copied so you can paste it in "to".</div>
</div>

<!-- settings sheet -->
<div class="sheet" id="sSheet">
  <h2>email template</h2>
  <div class="sub2">{name} {building} {price} fill per quote</div>
  <div class="field"><label>subject</label><input id="tplSubj"></div>
  <div class="field"><label>body</label><textarea id="tplBody"></textarea></div>
  <div class="field"><label>show buildings</label>
    <div class="freqrow" style="margin:0">
      <button class="freq on" id="fltNeed">need quotes</button>
      <button class="freq" id="fltAll">everything</button>
    </div>
  </div>
  <button class="bigbtn send" id="btnSaveTpl">save</button>
</div>

<div id="searchOv">
  <div class="srow">
    <input id="searchIn" placeholder="search buildings…" autocomplete="off">
    <button id="searchX">✕</button>
  </div>
  <div id="searchRes"></div>
</div>

<div id="toast"></div>

<script>
const SB_URL = 'https://hzbqzriceeukyrjjhubb.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6YnF6cmljZWV1a3lyampodWJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MTUxODksImV4cCI6MjA5NjA5MTE4OX0.W82AYok6n8Orrb0-_StRItYH04TxOWVNFCEeh4oxh7E';
const SBH = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };
const MAPS_KEY = 'AIzaSyAkpITR4NMOe5XSiZlWjqJUp66-fMRLMJw';

const SERVICES = [
  { id:'ext',   name:'exterior window cleaning',        desc:'Full building facade, rope descent, all floors',      base:b=>Math.max(1200, floorsNum(b)*400) },
  { id:'int',   name:'interior window cleaning',        desc:'All interior glass surfaces, every floor',            base:b=>Math.max(800,  floorsNum(b)*240) },
  { id:'pw',    name:'exterior pressure washing',       desc:'Building exterior, walkways & parking structure',     base:()=>1800 },
  { id:'hw',    name:'hard water & mineral removal',    desc:'Specialty solution — included every visit',           base:()=>900 },
  { id:'dust',  name:'high dusting',                    desc:'Lobbies, atriums & ceiling fixtures',                 base:()=>1200 },
  { id:'solar', name:'solar panel cleaning',            desc:'Deionized water, streak-free panels',                 base:()=>800 },
];
const FREQS = [ {k:'once',l:'once',v:1}, {k:'bi',l:'2×/yr',v:2}, {k:'qtr',l:'4×/yr',v:4}, {k:'mo',l:'12×/yr',v:12} ];

const $ = id => document.getElementById(id);
const fmt = n => '$' + Math.round(n).toLocaleString('en-US');
const store = { get:(k,d)=>{ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch(e){ return d; } }, set:(k,v)=>localStorage.setItem(k, JSON.stringify(v)) };

function floorsNum(b){ const m = String(b.floors||'').match(/\d+/g); return m ? Math.max(...m.map(Number)) : 5; }
function firstName(c){ const w = String(c||'').trim().split(/\s+/)[0]; return w ? w[0].toUpperCase()+w.slice(1).toLowerCase() : 'there'; }
function toast(m,t){ const el=$('toast'); el.innerHTML=m; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'), t||2600); }
function gorillas(){ for(let i=0;i<7;i++){ const g=document.createElement('div'); g.className='gor'; g.textContent='🦍';
  g.style.left=(8+Math.random()*84)+'vw'; g.style.bottom='8vh'; g.style.animationDelay=(Math.random()*.4)+'s';
  document.body.appendChild(g); setTimeout(()=>g.remove(),1800); } }

/* ---------- state ---------- */
let buildings=[], slides=[], picks={}, current=null, lastPdf=null, showAll=false, allB=[];
const geoCache = store.get('bbs_geo', {});
const tpl = store.get('bbs_tpl', {
  subject: 'Window Cleaning Quote — {building}',
  body: 'Hey {name},\n\nAttached is a quote to keep {building}\'s glass spotless — {price}/yr with our price lock guarantee, so your rate never moves for the life of the contract.\n\nWe\'re IWCA certified, fully insured, and OSHA compliant on every drop. Happy to walk the property with you and lock in a start date.\n\nAJ Harris\nClean Towers\n(480) 567 4394 · cleantowers.com'
});

function sentToday(){ const d = new Date().toLocaleDateString('en-CA',{timeZone:'America/Phoenix'});
  const s = store.get('bbs_sent', {d:'',n:0}); return s.d===d ? s.n : 0; }
function bumpSent(){ const d = new Date().toLocaleDateString('en-CA',{timeZone:'America/Phoenix'});
  const n = sentToday()+1; store.set('bbs_sent',{d,n}); $('streak').textContent = '🦍 '+n+' sent today'; }

/* ---------- data ---------- */
async function loadBuildings(){
  const r = await fetch(SB_URL+'/rest/v1/buildings?select=*&order=name.asc', { headers: SBH });
  if(!r.ok) throw new Error('supabase '+r.status);
  const all = await r.json();
  allB = all;
  const need = b => ['cold','contacted',''].includes(String(b.stage||'').toLowerCase().trim());
  let list = showAll ? all : all.filter(need);
  list.sort((a,b)=> (b.email?1:0)-(a.email?1:0) || String(a.city||'').localeCompare(String(b.city||'')));
  return list;
}

/* ---------- feed ---------- */
function buildFeed(){
  const feed = $('feed'); feed.innerHTML=''; slides=[]; picks={};
  if(!buildings.length){
    feed.innerHTML = '<div class="empty"><div class="g">🦍</div><h2>pipeline\'s clear</h2><p>no buildings waiting on quotes.<br>flip "show buildings" to everything in ⚙ to browse the whole board.</p></div>';
    $('hint').style.display='none'; return;
  }
  buildings.forEach((b,i)=>{
    const s = document.createElement('div'); s.className='slide'; s.dataset.i=i;
    const svcHtml = SERVICES.map(sv=>`
      <div class="svc" data-svc="${sv.id}">
        <div class="svc-head" onclick="toggleSvc(${i},'${sv.id}')">
          <div class="svc-check"></div>
          <div class="svc-title">${sv.name}</div>
          <div class="pin-wrap" onclick="event.stopPropagation()">
            <input inputmode="numeric" id="pin-${i}-${sv.id}" onfocus="editPrice(${i},'${sv.id}',this)" oninput="typePrice(${i},'${sv.id}',this.value)" onblur="donePrice(${i},'${sv.id}',this)">
            <div class="pin-sub">PER CLEAN</div>
          </div>
        </div>
        <div class="svc-body">
          <div class="freqrow">${FREQS.map(f=>`<button class="freq" data-f="${f.k}" onclick="setFreq(${i},'${sv.id}','${f.k}')">${f.l}</button>`).join('')}</div>
        </div>
      </div>`).join('');
    s.innerHTML = `
      <div class="mapbox" id="map-${i}"><div class="mapfallback">🏙</div></div>
      <div class="shade"></div>
      <div class="content">
        <div class="namerow">
          <div class="bname">${esc(b.name||'unnamed')}</div>
          <button class="mkq" onclick="markQuoted(${i})">✓ quoted</button>
        </div>
        <div class="meta">
          ${b.city?`<span class="tag">📍 ${esc(b.city)}</span>`:''}
          ${b.floors?`<span class="tag">🏢 ${esc(b.floors)} floors</span>`:''}
          ${b.contact?`<span class="tag sky">👤 ${esc(b.contact)}</span>`:''}
          ${b.email?`<span class="tag sky">✉ ready</span>`:'<span class="tag warn">no manager email</span>'}
        </div>
        <div class="svcwrap" id="svcwrap-${i}">${svcHtml}<button class="addsvc" id="add-${i}" onclick="addCustom(${i})">+ custom service</button></div>
        <div class="buildbar">
          <div class="tally"><div class="tt">ANNUAL</div><div class="tv" id="tally-${i}">$0</div></div>
          <button class="gobtn" id="go-${i}" disabled onclick="buildQuote(${i})">build quote →</button>
        </div>
      </div>`;
    feed.appendChild(s); slides.push(s);
  });
  observeSlides();
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- maps ---------- */
let mapsReady=false, geocoder=null, liveMaps={};
window.mapsInit = () => { mapsReady=true; geocoder = new google.maps.Geocoder(); refreshVisibleMaps(); };
function observeSlides(){
  const io = new IntersectionObserver(es=>{
    es.forEach(e=>{
      const i = +e.target.dataset.i;
      if(e.isIntersecting && e.intersectionRatio > .6){
        slides.forEach(s=>s.classList.remove('active'));
        e.target.classList.add('active');
        mountMap(i); mountMap(i+1);
        if(i>0) $('hint').style.display='none';
      }
    });
  }, { threshold:[.61] });
  slides.forEach(s=>io.observe(s));
  if(slides[0]){ slides[0].classList.add('active'); mountMap(0); mountMap(1); }
}
function refreshVisibleMaps(){ const a=document.querySelector('.slide.active'); if(a){ const i=+a.dataset.i; mountMap(i); mountMap(i+1); } }
async function mountMap(i){
  if(!mapsReady || !buildings[i] || liveMaps[i]) return;
  const b = buildings[i], el = $('map-'+i);
  try{
    const pos = await geocode(b);
    if(!pos) return;
    el.innerHTML='';
    liveMaps[i] = new google.maps.Map(el, {
      center: pos, zoom: 18, mapTypeId: 'satellite', tilt: 0,
      disableDefaultUI: true, gestureHandling: 'none', keyboardShortcuts: false
    });
  }catch(e){ /* keep fallback */ }
}
function geocode(b){
  const key = (b.name||'')+'|'+(b.city||'');
  if(geoCache[key]) return Promise.resolve(geoCache[key]);
  return new Promise(res=>{
    geocoder.geocode({ address: (b.name||'')+', '+(b.city||'') }, (r,st)=>{
      if(st==='OK' && r[0]){ const p={ lat:r[0].geometry.location.lat(), lng:r[0].geometry.location.lng(),
          addr: String(r[0].formatted_address||'').replace(/, USA$/,'') };
        geoCache[key]=p; store.set('bbs_geo', geoCache); res(p); }
      else res(null);
    });
  });
}

/* ---------- picks ---------- */
function pk(i){ if(!picks[i]) picks[i]={}; return picks[i]; }
window.toggleSvc = (i,id)=>{
  const p = pk(i), b = buildings[i];
  const el = document.querySelector(`.slide[data-i="${i}"] .svc[data-svc="${id}"]`);
  if(p[id]){ delete p[id]; el.classList.remove('on'); }
  else{
    if(Object.keys(p).length >= 4){ toast('template fits 4 services max'); return; }
    const sv = SERVICES.find(s=>s.id===id);
    p[id] = { price: Math.round(sv.base(b)/100)*100, freq:'once' };
    el.classList.add('on');
    el.querySelectorAll('.freq').forEach(f=>f.classList.toggle('on', f.dataset.f==='once'));
    $(`pin-${i}-${id}`).value = fmt(p[id].price);
  }
  paintTally(i);
};
window.setFreq = (i,id,f)=>{
  const p = pk(i); if(!p[id]) return; p[id].freq=f;
  document.querySelectorAll(`.slide[data-i="${i}"] .svc[data-svc="${id}"] .freq`)
    .forEach(el=>el.classList.toggle('on', el.dataset.f===f));
  paintTally(i);
};
window.editPrice = (i,id,el)=>{
  const p = pk(i); if(!p[id]) return;
  el.value = p[id].price; requestAnimationFrame(()=>el.select());
};
window.typePrice = (i,id,v)=>{
  const p = pk(i); if(!p[id]) return;
  const n = parseInt(String(v).replace(/[^\d]/g,''),10);
  p[id].price = (n>0?n:0); paintTally(i);   // soft save live as he types
};
window.donePrice = (i,id,el)=>{
  const p = pk(i); if(!p[id]) return;
  if(p[id].price<=0) p[id].price = 100;
  el.value = fmt(p[id].price); paintTally(i);
};
function rows(i){
  return Object.entries(pk(i)).map(([id,c])=>{
    const sv = id.startsWith('c_')
      ? { id, name:(c.name||'custom service'), desc:(c.desc||'') }
      : SERVICES.find(s=>s.id===id);
    const fq = FREQS.find(f=>f.k===c.freq);
    return { sv, freq:fq, price:c.price, total:c.price*fq.v };
  });
}
window.addCustom = (i)=>{
  const p = pk(i);
  if(Object.keys(p).length >= 4){ toast('template fits 4 services max'); return; }
  const id = 'c_' + Date.now();
  p[id] = { name:'', desc:'', price:500, freq:'once' };
  const card = document.createElement('div');
  card.className = 'svc on'; card.dataset.svc = id;
  card.innerHTML = `
    <div class="svc-head">
      <button class="cx" onclick="rmCustom(${i},'${id}')">✕</button>
      <input class="cname" placeholder="service name" oninput="pk(${i})['${id}'].name=this.value">
      <div class="pin-wrap" onclick="event.stopPropagation()">
        <input inputmode="numeric" id="pin-${i}-${id}" onfocus="editPrice(${i},'${id}',this)" oninput="typePrice(${i},'${id}',this.value)" onblur="donePrice(${i},'${id}',this)">
        <div class="pin-sub">PER CLEAN</div>
      </div>
    </div>
    <div class="svc-body">
      <input class="cdesc" placeholder="short description (shows on the quote)" oninput="pk(${i})['${id}'].desc=this.value">
      <div class="freqrow">${FREQS.map(f=>`<button class="freq${f.k==='once'?' on':''}" data-f="${f.k}" onclick="setFreq(${i},'${id}','${f.k}')">${f.l}</button>`).join('')}</div>
    </div>`;
  $('svcwrap-'+i).insertBefore(card, $('add-'+i));
  $(`pin-${i}-${id}`).value = fmt(500);
  card.querySelector('.cname').focus();
  card.scrollIntoView({ block:'nearest', behavior:'smooth' });
  paintTally(i);
};
window.rmCustom = (i,id)=>{
  delete pk(i)[id];
  const el = document.querySelector(`.slide[data-i="${i}"] .svc[data-svc="${id}"]`);
  if(el) el.remove();
  paintTally(i);
};
function annual(i){ return rows(i).reduce((a,r)=>a+r.total,0); }
function paintTally(i){
  const t = annual(i);
  $('tally-'+i).textContent = fmt(t);
  $('go-'+i).disabled = t<=0;
}

function ord(n){ const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function makePdf(b, rs, total, qn){
  const { jsPDF } = window.jspdf;
  const d = new jsPDF({ unit:'pt', format:'letter' });
  const SKY=[41,171,226], INK=[45,45,45], GRAY=[120,132,148];
  d.addImage(CT_BG, 'JPEG', 0, 0, 612, 792);
  const ds = x => x.toLocaleDateString('en-US',{month:'short',timeZone:'America/Phoenix'}) + ' ' +
    ord(+x.toLocaleDateString('en-US',{day:'numeric',timeZone:'America/Phoenix'})) + ', ' +
    x.toLocaleDateString('en-US',{year:'numeric',timeZone:'America/Phoenix'});
  const today = new Date(), until = new Date(Date.now()+30*864e5);

  // prepared for: building name, manager under it (skipped if none), address under that
  d.setTextColor(...INK); d.setFont('helvetica','bold'); d.setFontSize(13); d.text(String(b.name||''), 36, 136);
  let py = 148.5;
  d.setFont('helvetica','normal');
  if(b.contact){ d.setFontSize(10); d.setTextColor(70,78,90); d.text(String(b.contact), 36, py); py += 12; }
  const addr = b.address || (geoCache[(b.name||'')+'|'+(b.city||'')]||{}).addr || b.city || '';
  if(addr){ d.setFontSize(8.5); d.setTextColor(...GRAY); d.text(String(addr), 36, py); }
  // meta values
  d.setTextColor(...INK); d.setFont('helvetica','bold'); d.setFontSize(10.5);
  d.text(qn, 456.5, 126.7);
  d.setFontSize(8.5);
  d.text(ds(today), 456.5, 143); d.text(ds(until), 456.5, 159.8);

  // table rows (max 4 — matches template stripes)
  const tops = [249.6, 284.6, 319.7, 354.2];
  rs.slice(0,4).forEach((r,ix)=>{
    const t = tops[ix];
    d.setTextColor(...INK); d.setFont('helvetica','bold'); d.setFontSize(10.5);
    d.text(r.sv.name.replace(/\b\w/g,c=>c.toUpperCase()), 23, t+15);
    d.setFont('helvetica','normal'); d.setFontSize(7.5); d.setTextColor(...GRAY); d.text(r.sv.desc, 23, t+26);
    d.setTextColor(...INK); d.setFontSize(9.5);
    const fl = r.freq.k==='once' ? 'Once' : r.freq.v + 'x / year';
    d.text(fl, 272.6, t+17, {align:'center'});
    d.text(String(r.freq.v), 346.5, t+17, {align:'center'});
    d.text('$'+r.price.toLocaleString('en-US')+'.00', 425.6, t+17, {align:'center'});
    d.setFont('helvetica','bold');
    d.text('$'+r.total.toLocaleString('en-US')+'.00', 576, t+17, {align:'right'});
  });

  // annual total
  d.setTextColor(...SKY); d.setFont('helvetica','bold'); d.setFontSize(16);
  d.text(fmt(total), 576, 451, {align:'right'});
  return d;
}

/* ---------- build + send ---------- */
window.buildQuote = (i)=>{
  const b = buildings[i], rs = rows(i), total = annual(i);
  if(!rs.length) return;
  const qn = quoteNo();
  const pdf = makePdf(b, rs, total, qn);
  const fname = qn+'_'+String(b.name||'quote').replace(/[^\w]+/g,'_')+'.pdf';
  lastPdf = { blob: pdf.output('blob'), fname, b, total, qn, i };
  current = i;
  $('qsName').textContent = b.name || 'quote';
  $('qsMeta').textContent = qn+' · '+(b.contact||'no contact')+(b.email ? ' · '+b.email : ' · ⚠ no email on file');
  $('qsRows').innerHTML = rs.map(r=>
    `<div class="qrow"><span><b>${esc(r.sv.name)}</b> · ${r.freq.l}</span><span class="amt">${fmt(r.total)}</span></div>`
  ).join('') + `<div class="qtotal"><span class="lab">ANNUAL TOTAL</span><span class="val">${fmt(total)}</span></div>`;
  $('btnMark').style.display='none';
  $('sheetBg').classList.add('show'); $('qSheet').classList.add('show');
  saveQuoteRecord('built');
};

function fill(t, b, total){
  return t.replace(/\{name\}/gi, firstName(b.contact)).replace(/\{building\}/gi, b.name||'your building')
          .replace(/\{price\}/gi, fmt(total));
}

$('btnSend').onclick = async ()=>{
  const { blob, fname, b, total } = lastPdf;
  const subj = fill(tpl.subject, b, total), body = fill(tpl.body, b, total);
  if(b.email){ try{ await navigator.clipboard.writeText(b.email); toast('✉ '+esc(b.email)+' copied — paste in "to"'); }catch(e){} }
  const file = new File([blob], fname, { type:'application/pdf' });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{
      await navigator.share({ files:[file], title: subj, text: subj+'\n\n'+body });
      $('btnMark').style.display='block';
    }catch(e){ /* user cancelled */ }
  }else{
    dl(blob, fname);
    location.href = 'mailto:'+encodeURIComponent(b.email||'')+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body+'\n\n(quote pdf downloaded — attach it)');
    $('btnMark').style.display='block';
  }
};
$('btnDl').onclick = ()=> dl(lastPdf.blob, lastPdf.fname);
function dl(blob, fname){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; a.click(); }

async function flipQuoted(b){
  try{
    const cased = (allB.find(x=>String(x.stage||'').toLowerCase()==='quoted')||{}).stage || 'Quoted';
    await fetch(SB_URL+'/rest/v1/buildings?id=eq.'+encodeURIComponent(b.id), {
      method:'PATCH', headers:SBH, body: JSON.stringify({ stage: cased, updated_at: Date.now() })
    });
    b.stage = cased;
  }catch(e){}
}
function advanceAndRemove(i){
  const curEl = slides[i]; if(!curEl || !curEl.isConnected) return;
  const live = slides.filter(s=>s.isConnected);
  const ix = live.indexOf(curEl);
  const next = live[ix+1] || live[ix-1];
  buildings[i]._gone = true;
  if(next){
    $('feed').scrollTo({ top: next.offsetTop, behavior:'smooth' });
    setTimeout(()=>{
      curEl.remove();
      $('feed').scrollTo({ top: next.offsetTop, behavior:'auto' });
      slides.forEach(s=>s.classList.remove('active')); next.classList.add('active');
      const ni = +next.dataset.i; mountMap(ni); mountMap(ni+1);
    }, 480);
  }else{
    curEl.remove();
    $('feed').innerHTML = '<div class="empty"><div class="g">🦍</div><h2>board cleared</h2><p>every building here is quoted.<br>🔍 search or flip the ⚙ filter to keep going.</p></div>';
    slides = [];
  }
}
window.markQuoted = (i)=>{
  const b = buildings[i];
  flipQuoted(b);
  bumpSent();
  toast('✓ '+esc(b.name||'building')+' marked quoted');
  advanceAndRemove(i);
};
$('btnMark').onclick = async ()=>{
  const { b, i } = lastPdf;
  bumpSent(); gorillas(); closeSheets();
  toast('🦍 sent — '+esc(b.name)+' flipped to quoted');
  flipQuoted(b);
  saveQuoteRecord('sent');
  advanceAndRemove(i);
};

async function saveQuoteRecord(status){
  try{
    const { b, total, qn, fname, blob } = lastPdf;
    let pdf_url = null;
    if(status==='sent'){
      const up = await fetch(SB_URL+'/storage/v1/object/quotes/'+fname, {
        method:'POST', headers:{ 'apikey':SB_KEY, 'Authorization':'Bearer '+SB_KEY, 'Content-Type':'application/pdf', 'x-upsert':'true' }, body: blob
      });
      if(up.ok) pdf_url = SB_URL+'/storage/v1/object/public/quotes/'+fname;
    }
    await fetch(SB_URL+'/rest/v1/quotes', { method:'POST', headers:{...SBH, 'Prefer':'resolution=merge-duplicates'},
      body: JSON.stringify({ id: qn, building_id: b.id, building_name: b.name, email: b.email, contact: b.contact,
        total: total, status, pdf_url, created_at: Date.now() }) });
  }catch(e){ /* table optional — core flow never blocks */ }
}

/* ---------- search ---------- */
function openSearch(){ $('searchOv').classList.add('show'); $('searchIn').value=''; paintSearch(''); setTimeout(()=>$('searchIn').focus(), 60); }
function closeSearch(){ $('searchOv').classList.remove('show'); $('searchIn').blur(); }
$('searchBtn').onclick = openSearch;
$('searchX').onclick = closeSearch;
$('searchIn').oninput = e => paintSearch(e.target.value);
function paintSearch(q){
  q = q.trim().toLowerCase();
  const hits = allB.filter(b =>
    !q || [b.name,b.city,b.contact].some(v => String(v||'').toLowerCase().includes(q))
  ).slice(0, 40);
  $('searchRes').innerHTML = hits.length ? hits.map(b => `
    <button class="sres" onclick="jumpTo('${String(b.id).replace(/'/g,"\\'")}')">
      <div class="n">${esc(b.name||'unnamed')}${b.stage?`<span class="st">${esc(b.stage)}</span>`:''}</div>
      <div class="m">${esc(b.city||'')}${b.contact?' · '+esc(b.contact):''}${b.email?'':' · ⚠ no email'}</div>
    </button>`).join('')
    : '<div style="text-align:center;color:#8fa0b5;font-size:12.5px;padding:30px 0">no buildings match</div>';
}
window.jumpTo = (id)=>{
  closeSearch();
  let ix = buildings.findIndex(b => String(b.id) === String(id));
  if(ix === -1){
    const b = allB.find(x => String(x.id) === String(id));
    if(!b) return;
    buildings.unshift(b); buildFeed(); ix = 0;
    if(mapsReady) refreshVisibleMaps();
  }
  const s = slides[ix]; if(!s) return;
  $('feed').scrollTo({ top: s.offsetTop, behavior: ix===0 ? 'auto' : 'smooth' });
};

/* ---------- boot ---------- */
async function reload(){
  try{ liveMaps={}; buildings = await loadBuildings(); buildFeed(); if(mapsReady) refreshVisibleMaps(); }
  catch(e){ toast('⚠ couldn\'t load buildings — check connection'); }
}
(async ()=>{
  $('streak').textContent = '🦍 '+sentToday()+' sent today';
  await reload();
  $('loader').style.display='none';
  const sc = document.createElement('script');
  sc.src = 'https://maps.googleapis.com/maps/api/js?key='+MAPS_KEY+'&callback=mapsInit';
  sc.async = true; document.head.appendChild(sc);
})();
</script>
</body>
</html>
